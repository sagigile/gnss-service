[project]
name = "gnss-service"
version = "0.1.0"
description = "Async web service that turns RINEX files into GNSS tracks (CSV/KML) and quality metrics"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "fastapi", "uvicorn[standard]", "sqlalchemy", "alembic", "python-multipart", "rq", "redis", "psycopg[binary]"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "fakeredis", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["src/gnss_service/solver/legacy_main.py", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Depends"]
